name: 功能建議
description: 提議新的規劃功能、資料模型或介面改善
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請先描述使用情境，不要只描述解法。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 說明輸入、計算、輸出與介面應如何運作。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 功能範圍
      options:
        - 收入與支出
        - 投資與資產
        - 負債
        - 保險保障
        - 稅務
        - 圖表與財務比率
        - 資料匯入／匯出
        - 隱私與安全
        - 文件與測試
        - 其他
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: 公式、制度或資料來源
      description: 涉及財務、稅務或保險制度時，請附可查證來源與適用年度。
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案與限制
      description: 說明其他做法，以及本方案可能造成的風險或複雜度。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 此功能仍以教育與情境模擬為目的，不會宣稱保證結果。
          required: true
