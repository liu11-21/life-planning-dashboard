name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

          python <<'PY'
          from pathlib import Path

          index_path = Path("_site/index.html")
          html = index_path.read_text(encoding="utf-8")

          html = html.replace(
              "Cathay planning prototype",
              "Open-source life planning simulator",
          )

          disclaimer_style = """
            <style>
              .site-disclaimer {
                max-width: 1440px;
                margin: 20px auto 40px;
                padding: 16px 20px;
                border: 1px solid rgba(74, 92, 85, 0.22);
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.82);
                color: #40504a;
                font-size: 0.9rem;
                line-height: 1.65;
              }
              .site-disclaimer strong {
                display: block;
                margin-bottom: 4px;
                color: #24362f;
              }
            </style>
          """

          disclaimer = """
            <section class="site-disclaimer" role="note" aria-label="使用聲明">
              <strong>教育與情境模擬用途</strong>
              本工具的計算結果僅供財務教育與初步規劃參考，不構成保險招攬、投資建議、稅務申報、法律意見或任何收益與理賠保證。正式決策前，請查閱最新制度、商品條款並諮詢合格專業人士。
            </section>
          """

          if "site-disclaimer" not in html:
              html = html.replace("</head>", f"{disclaimer_style}\n</head>")
              html = html.replace("</main>", f"</main>\n{disclaimer}")

          index_path.write_text(html, encoding="utf-8")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
